"$schema" = 'https://starship.rs/config-schema.json'

format = """
[░▒▓](#3c558b)\
$os\
[](bg:#4078f2 fg:#3c558b)\
$directory\
[](fg:#4078f2 bg:#c7c9d5)\
$git_branch\
$git_status\
[](fg:#c7c9d5 bg:#e3e5ee)\
$nodejs\
$bun\
$rust\
$golang\
$php\
[](fg:#e3e5ee bg:#fdfdfd)\
$time\
[ ](fg:#fdfdfd)\
\n$character"""

[directory]
style = "fg:#061331 bg:#4078f2"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#c7c9d5"
format = '[[ $symbol $branch ](fg:#3261c5 bg:#c7c9d5)]($style)'

[git_status]
style = "bg:#c7c9d5"
format = '[[($all_status$ahead_behind )](fg:#3261c5 bg:#c7c9d5)]($style)'

[nodejs]
symbol = ""
style = "bg:#e3e5ee"
format = '[[ $symbol ($version) ](fg:#3d72e7 bg:#e3e5ee)]($style)'

[bun]
symbol = ""
style = "bg:#e3e5ee"
format = '[[ $symbol ($version) ](fg:#3d72e7 bg:#e3e5ee)]($style)'

[rust]
symbol = ""
style = "bg:#e3e5ee"
format = '[[ $symbol ($version) ](fg:#3d72e7 bg:#e3e5ee)]($style)'

[golang]
symbol = ""
style = "bg:#e3e5ee"
format = '[[ $symbol ($version) ](fg:#3d72e7 bg:#e3e5ee)]($style)'

[php]
symbol = ""
style = "bg:#e3e5ee"
format = '[[ $symbol ($version) ](fg:#3d72e7 bg:#e3e5ee)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#fdfdfd"
format = '[[  $time ](fg:#4078f2 bg:#fdfdfd)]($style)'

[os]
style = "bg:#3c558b fg:#f9f9fa"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""
