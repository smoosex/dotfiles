"$schema" = 'https://starship.rs/config-schema.json'

format = """
[░▒▓](#c4cfe6)\
$os\
[](bg:#7aa2f7 fg:#c4cfe6)\
$directory\
[](fg:#7aa2f7 bg:#3b496d)\
$git_branch\
$git_status\
[](fg:#3b496d bg:#171822)\
$nodejs\
$bun\
$rust\
$golang\
$php\
[](fg:#171822 bg:#14141c)\
$time\
[ ](fg:#14141c)\
\n$character"""

[directory]
style = "fg:#29395c bg:#7aa2f7"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#3b496d"
format = '[[ $symbol $branch ](fg:#7aa2f7 bg:#3b496d)]($style)'

[git_status]
style = "bg:#3b496d"
format = '[[($all_status$ahead_behind )](fg:#7aa2f7 bg:#3b496d)]($style)'

[nodejs]
symbol = ""
style = "bg:#171822"
format = '[[ $symbol ($version) ](fg:#7aa2f7 bg:#171822)]($style)'

[bun]
symbol = ""
style = "bg:#171822"
format = '[[ $symbol ($version) ](fg:#7aa2f7 bg:#171822)]($style)'

[rust]
symbol = ""
style = "bg:#171822"
format = '[[ $symbol ($version) ](fg:#7aa2f7 bg:#171822)]($style)'

[golang]
symbol = ""
style = "bg:#171822"
format = '[[ $symbol ($version) ](fg:#7aa2f7 bg:#171822)]($style)'

[php]
symbol = ""
style = "bg:#171822"
format = '[[ $symbol ($version) ](fg:#7aa2f7 bg:#171822)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#14141c"
format = '[[  $time ](fg:#7aa2f7 bg:#14141c)]($style)'

[os]
style = "bg:#c4cfe6 fg:#373b42"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""
