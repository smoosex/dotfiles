# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

config-version = 2

# 空 workspace 也常驻（sketchybar 的 space 图标靠这个）
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']

# You can use it to add commands that run after AeroSpace startup.
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = ['exec-and-forget sketchybar']

# Notify Sketchybar about workspace change
exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE',
]

# Start AeroSpace at login
start-at-login = false

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
# enable-normalization-flatten-containers = true
# enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = [
  # 'move-mouse window-lazy-center',
  'exec-and-forget sketchybar --trigger aerospace_focus_change',
]

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = false

# Possible values: (qwerty|dvorak|colemak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = [
  { monitor.'Built-in Retina Display' = 8 },
  { monitor.U27N3R = 38 },
  38,
]
outer.right = 8

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]

# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
#                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
#                   backspace, tab, pageUp, pageDown, home, end, forwardDelete,
#                   sectionSign (ISO keyboards only, european keyboards only)
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right

# All possible modifiers: cmd, alt, ctrl, shift

# All possible commands: https://nikitabobko.github.io/AeroSpace/commands

# See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
# You can uncomment the following lines to open up terminal with alt + enter shortcut
# (like in i3)
# alt-enter = '''exec-and-forget osascript -e '
# tell application "Terminal"
#     do script
#     activate
# end tell'
# '''

# Window navigation (hyper)
ctrl-shift-cmd-alt-h = 'focus left --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors'
ctrl-shift-cmd-alt-j = 'focus down --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors'
ctrl-shift-cmd-alt-k = 'focus up --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors'
ctrl-shift-cmd-alt-l = 'focus right --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors'

# Workspace navigation (hyper)
ctrl-shift-cmd-alt-semicolon = 'workspace-back-and-forth'
ctrl-shift-cmd-alt-leftSquareBracket = 'workspace --wrap-around prev'
ctrl-shift-cmd-alt-rightSquareBracket = 'workspace --wrap-around next'
ctrl-shift-cmd-alt-u = 'workspace 1'
ctrl-shift-cmd-alt-i = 'workspace 2'
ctrl-shift-cmd-alt-o = 'workspace 3'
ctrl-shift-cmd-alt-p = 'workspace 4'
ctrl-shift-cmd-alt-5 = 'workspace 5'
ctrl-shift-cmd-alt-6 = 'workspace 6'
ctrl-shift-cmd-alt-7 = 'workspace 7'
ctrl-shift-cmd-alt-8 = 'workspace 8'
ctrl-shift-cmd-alt-9 = 'workspace 9'

# Window movement: swap with neighbour (ctrl-shift)
ctrl-shift-h = 'swap left'
ctrl-shift-j = 'swap down'
ctrl-shift-k = 'swap up'
ctrl-shift-l = 'swap right'

# Window movement: send to workspace and follow (shift-alt)
alt-shift-u = 'move-node-to-workspace --focus-follows-window 1'
alt-shift-i = 'move-node-to-workspace --focus-follows-window 2'
alt-shift-o = 'move-node-to-workspace --focus-follows-window 3'
alt-shift-p = 'move-node-to-workspace --focus-follows-window 4'
alt-shift-5 = 'move-node-to-workspace --focus-follows-window 5'
alt-shift-6 = 'move-node-to-workspace --focus-follows-window 6'
alt-shift-7 = 'move-node-to-workspace --focus-follows-window 7'
alt-shift-8 = 'move-node-to-workspace --focus-follows-window 8'
alt-shift-9 = 'move-node-to-workspace --focus-follows-window 9'

# Layout of the focused window (ctrl-shift)
ctrl-shift-b = 'layout tiling'
ctrl-shift-f = 'layout floating'

# Resize (meh)
ctrl-shift-alt-h = 'resize width -100'
ctrl-shift-alt-j = 'resize height +100'
ctrl-shift-alt-k = 'resize height -100'
ctrl-shift-alt-l = 'resize width +100'
ctrl-shift-alt-e = 'balance-sizes'

# 浮动窗口固定尺寸（ctrl-shift-alt + 数字）
ctrl-cmd-enter = 'exec-and-forget ~/.local/bin/aerospace-float-size 1280 800'
ctrl-shift-alt-enter = 'fullscreen --no-outer-gaps'

# Other bindings kept from the previous config
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'
ctrl-shift-cmd-alt-enter = 'fullscreen'
cmd-alt-w = "close"
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'
alt-shift-semicolon = 'mode service'
alt-space = ['layout floating tiling', 'mode main']

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
# f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']

# sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
#s = ['layout sticky tiling', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

down = 'volume down'
up = 'volume up'
shift-down = ['volume set 0', 'mode main']

# terminal
[[on-window-detected]]
if = 'test %{app-bundle-id} = org.alacritty'
run = ['layout tiling', 'move-node-to-workspace 1']

[[on-window-detected]]
if = 'test %{app-bundle-id} = net.kovidgoyal.kitty'
run = ['layout tiling', 'move-node-to-workspace 1']


# browser
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.Safari'
run = ['layout tiling', 'move-node-to-workspace 2']

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.google.Chrome'
run = ['layout tiling', 'move-node-to-workspace 2']

# communication
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.tencent.xinWeChat'
run = ['layout tiling', 'move-node-to-workspace 3']

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.electron.lark'
run = ['layout tiling', 'move-node-to-workspace 3']

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.hnc.Discord'
run = ['layout tiling', 'move-node-to-workspace 3']

[[on-window-detected]]
if = 'true'
run = ['layout floating']
