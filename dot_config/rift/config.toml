[settings]
default_disable = false
animate = true
animation_duration = 0.3
hot_reload = true
focus_follows_mouse = false
mouse_follows_focus = false
mouse_hides_on_focus = false
run_on_start = [
    "/opt/homebrew/bin/rift-cli subscribe cli --event workspace_changed --command /bin/sh --args -c --args '/opt/homebrew/bin/sketchybar --trigger rift_update'",
    "/opt/homebrew/bin/rift-cli subscribe cli --event windows_changed --command /bin/sh --args -c --args '/opt/homebrew/bin/sketchybar --trigger rift_update'",
    "/opt/homebrew/bin/rift-cli subscribe cli --event focused_window_changed --command /bin/sh --args -c --args '/opt/homebrew/bin/sketchybar --trigger rift_update'",
]

[settings.layout]
mode = "master_stack"
window_insertion_point = "next_to_selection"

# Reserve the full bar footprint by default; SketchyBar synchronizes per-display insets.
[settings.layout.gaps.outer]
top = 8
bottom = 8
left = 8
right = 8

[settings.layout.gaps.inner]
horizontal = 8.0
vertical = 8.0

# 原生菜单栏已由 macOS 排除，不再额外预留 SketchyBar 的 40pt。
[settings.layout.gaps.per_display."37D8832A-2D66-02CA-B9F7-8F30A301B230".outer]
top = 8
bottom = 8
left = 8
right = 8

[settings.ui.mission_control]
enabled = false
show_empty_workspaces = true

[settings.ui.menu_bar]
enabled = true
mode = "active"
display_style = "label"
active_label = "index"
show_empty = false

[settings.drag_drop]
modifier = "alt"
action1 = "move"
drop_action = "swap"

[virtual_workspaces]
enabled = true
default_workspace_count = 9
auto_assign_windows = true
preserve_focus_per_workspace = true
workspace_auto_back_and_forth = false
prevent_wrapping = true
workspace_names = ["terminal", "browser", "communication", "video", "nsfw", "6", "7", "8", "9"]
# 已安装的应用一律用 app_id 精确匹配；app_name 是子串匹配，容易误伤。
# 未安装的备用应用（WezTerm/Firefox/Zen/Brave/Alfred/CC Switch/Gemini）保留 app_name。
# 同 app_id 的多条规则：字段多的优先，平票时靠前的优先 —— 所以例外规则要写在前面。
app_rules = [
    # --- 工作区分配 ---
    { app_id = "com.mitchellh.ghostty", workspace = "terminal", focus = true },
    { app_id = "org.alacritty", workspace = "terminal", focus = true },
    { app_name = "WezTerm", workspace = "terminal", focus = true },
    { app_id = "net.kovidgoyal.kitty", workspace = "terminal", focus = true },
    { app_id = "com.apple.Terminal", workspace = "terminal", focus = true },

    # Safari 的设置窗口浮动，必须排在下面的 browser 规则之前。
    { app_id = "com.apple.Safari", title_regex = "^(Safari )?(Settings|Preferences|设置|偏好设置)$|^(General|(Tab|Password|Website|Extension)s|AutoFill|Se(arch|curity)|Privacy|Advance)$", floating = true },
    { app_id = "com.apple.Safari", workspace = "browser", focus = true },
    { app_id = "com.google.Chrome", workspace = "browser", focus = true },
    { app_name = "Firefox", workspace = "browser", focus = true },
    { app_name = "Zen", workspace = "browser", focus = true },
    { app_name = "Brave", workspace = "browser", focus = true },

    # 微信 / QQ：主窗口进 communication，其余窗口（小程序、图片查看器）浮动。
    { app_id = "com.tencent.xinWeChat", title_regex = "^(Weixin|微信)$", workspace = "communication", focus = true },
    { app_id = "com.tencent.xinWeChat", floating = true },
    { app_id = "com.tencent.qq", title_regex = "^(QQ|'QQ)$", workspace = "communication", focus = true },
    { app_id = "com.tencent.qq", floating = true },

    { app_id = "com.apple.mail", workspace = "communication", focus = true },
    { app_id = "com.electron.lark", workspace = "communication", focus = true },
    { app_id = "com.hnc.Discord", workspace = "communication", focus = true },

    # --- 系统窗口：Finder、系统设置面板、关于本机 ---
    { app_id = "com.apple.finder", floating = true },
    { app_id = "com.apple.systempreferences", floating = true },
    { app_id = "com.apple.SystemProfiler", title_regex = "(About This Mac|关于本机)", floating = true },

    # --- 浮动：不参与平铺，但仍保留在 Rift 的窗口列表里 ---
    { app_id = "com.netease.mumu.nemux", floating = true },
    { app_id = "com.netease.mumu.nemux.emulator", floating = true },
    { app_id = "com.yetone.magpie", floating = true },
    { app_id = "com.apple.calculator", floating = true },
    { app_id = "com.apple.ActivityMonitor", floating = true },
    { app_id = "com.raycast.macos", floating = true },
    { app_name = "Alfred", floating = true },
    { app_id = "com.apple.Preview", floating = true },
    { app_id = "com.apple.Music", floating = true },
    { app_id = "com.anthropic.claudefordesktop", floating = true },
    { app_id = "com.openai.codex", floating = true },
    { app_name = "CC Switch", floating = true },
    { app_name = "Gemini", floating = true },

    # 从 yabai 的 manage=off 名单里补回的已装应用。
    { app_id = "com.apple.Dictionary", floating = true },
    { app_id = "com.apple.PhotoBooth", floating = true },
    { app_id = "com.apple.AppStore", floating = true },
    { app_id = "org.pqrs.Karabiner-Elements.Settings", floating = true },
    { app_id = "org.pqrs.Karabiner-EventViewer", floating = true },
    { app_id = "com.nssurge.surge-mac", floating = true },
    { app_id = "com.nssurge.surge-dashboard", floating = true },
    { app_id = "com.tweety.MediaMate", floating = true },
    { app_id = "com.electron.pritunl", floating = true },
    { app_id = "com.crossutility.quantumult-x", floating = true },
    { app_id = "dev.kdrag0n.MacVirt", floating = true },
    { app_id = "com.vinz.codenotch", floating = true },
]

[modifier_combinations]
hyper = "Ctrl + Alt + Shift + Meta"
meh = "Ctrl + Alt + Shift"

[keys]
"hyper + H" = { move_focus = "left" }
"hyper + J" = { move_focus = "down" }
"hyper + K" = { move_focus = "up" }
"hyper + L" = { move_focus = "right" }
"hyper + M" = "promote_to_master"
"hyper + C" = "center_selection"
"hyper + W" = "switch_preset_column_width"

# skhd keycodes 0x29 / 0x21 / 0x1e are semicolon / left bracket / right bracket.
"hyper + Semicolon" = "switch_to_last_workspace"
"hyper + BracketLeft" = { prev_workspace = false }
"hyper + BracketRight" = { next_workspace = false }
"hyper + U" = { switch_to_workspace = 0 }
"hyper + I" = { switch_to_workspace = 1 }
"hyper + O" = { switch_to_workspace = 2 }
"hyper + P" = { switch_to_workspace = 3 }
"hyper + 5" = { switch_to_workspace = 4 }
"hyper + 6" = { switch_to_workspace = 5 }
"hyper + 7" = { switch_to_workspace = 6 }
"hyper + 8" = { switch_to_workspace = 7 }
"hyper + 9" = { switch_to_workspace = 8 }

# Rift moves tree nodes rather than performing yabai's directional swaps.
"Ctrl + Shift + H" = { move_node = "left" }
"Ctrl + Shift + J" = { move_node = "down" }
"Ctrl + Shift + K" = { move_node = "up" }
"Ctrl + Shift + L" = { move_node = "right" }

"Alt + Shift + U" = { move_window_to_workspace = { workspace = 0, follow = true } }
"Alt + Shift + I" = { move_window_to_workspace = { workspace = 1, follow = true } }
"Alt + Shift + O" = { move_window_to_workspace = { workspace = 2, follow = true } }
"Alt + Shift + P" = { move_window_to_workspace = { workspace = 3, follow = true } }
"Alt + Shift + 5" = { move_window_to_workspace = { workspace = 4, follow = true } }
"Alt + Shift + 6" = { move_window_to_workspace = { workspace = 5, follow = true } }
"Alt + Shift + 7" = { move_window_to_workspace = { workspace = 6, follow = true } }
"Alt + Shift + 8" = { move_window_to_workspace = { workspace = 7, follow = true } }
"Alt + Shift + 9" = { move_window_to_workspace = { workspace = 8, follow = true } }

"Ctrl + Shift + B" = { set_workspace_layout = { mode = "bsp" } }
"Ctrl + Shift + F" = { set_workspace_layout = { mode = "floating" } }
"Ctrl + Shift + S" = { set_workspace_layout = { mode = "scrolling" } }
"Ctrl + Shift + M" = { set_workspace_layout = { mode = "master_stack" } }

# Rift resizes by roughly 5%, not yabai's fixed 100 pixels.
"meh + H" = { resize_window_shrink = "horizontal" }
"meh + J" = { resize_window_grow = "vertical" }
"meh + K" = { resize_window_shrink = "vertical" }
"meh + L" = { resize_window_grow = "horizontal" }
"hyper + Enter" = "toggle_fullscreen_within_gaps"
"Alt + Space" = { toggle_window_floating = { center = true, size = "smart" } }
"Meta + Shift + C" = "create_workspace"

# Keep an explicit activation switch and a manual reload shortcut.
"Alt + Z" = "toggle_space_activated"
"hyper + R" = "reload_config"
